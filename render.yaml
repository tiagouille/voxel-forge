services:
  - type: web
    name: voxel-forge-backend
    runtime: node
    plan: free
    buildCommand: cd server && pnpm install
    startCommand: cd server && node index.js
    envVars:
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
